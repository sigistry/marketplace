name: Feature request
description: Suggest an improvement to the registry, the verification methodology, or the website.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Registry / marketplace.json
        - Verification methodology
        - sigistry.com website
        - MCP server
        - Docs / contributing flow
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
